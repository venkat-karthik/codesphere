version: '3.9'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JUDGE0_API_KEY=${JUDGE0_API_KEY}
    volumes:
      - pdf_uploads:/app/server/uploads/pdfs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/roadmaps"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pdf_uploads:
