name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all dependencies
        run: |
          npm ci --ignore-scripts
          cd client && npm ci --ignore-scripts

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Build Docker image
        run: docker build -t codesphere:${{ github.sha }} .

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        run: |
          echo "Add your deployment steps here"
          echo "e.g. SSH to server, pull latest image, restart container"
          # Example for Railway/Render: push to main triggers auto-deploy
          # Example for VPS:
          # ssh user@server 'cd /app && git pull && docker-compose up -d --build'
